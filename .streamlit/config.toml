[theme]
primaryColor = "#F1642E" # Naranja saturado de la paleta (botones, selecciones y sliders)
backgroundColor = "#504E76" # Morado oscuro (fondo principal)
secondaryBackgroundColor = "#C4C3E3" # Morado pastel (barra lateral, contenedores y tablas)
textColor = "#FDF8E2" # Beige claro (texto principal con excelente contraste)
accentColor = "#A3B565" # Verde claro apacible (detalles y acentos)
font = "sans serif" # Fuente principal de la interfaz

[ui]
hideTopBar = false
