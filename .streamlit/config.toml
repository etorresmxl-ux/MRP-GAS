[theme]
primaryColor = "#2E77AE" # Color primario utilizado en botones, enlaces, selecciones y sliders
backgroundColor = "#0d2137" # Color de fondo principal de toda la aplicación
secondaryBackgroundColor = "#162B46" # Color de fondo para elementos secundarios como la barra lateral y tablas
textColor = "#E0EAF5" # Color principal del texto
accentColor = "#FF8E2B" # Color de acento opcional
font = "sans serif" # Fuente principal de la interfaz

[ui]
hideTopBar = false
