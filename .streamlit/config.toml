[theme]
primaryColor = "#209EBB" # Color primario utilizado en botones, enlaces, selecciones y sliders (Azul Turquesa)
backgroundColor = "#023047" # Color de fondo principal de toda la aplicación (Azul Marino Profundo)
secondaryBackgroundColor = "#122330" # Color de fondo para elementos secundarios como la barra lateral y tablas (Tono intermedio oscuro)
textColor = "#8ECAE6" # Color principal del texto (Celeste claro para mantener alto contraste y legibilidad)
font = "sans serif" # Fuente principal de la interfaz ("sans serif", "serif", "monospace")

[ui]
hideTopBar = false
