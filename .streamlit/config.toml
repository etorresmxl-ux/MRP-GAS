[theme]

primaryColor = "#EA8B33" # Naranja principal de la paleta (botones, selectores y sliders)

backgroundColor = "#132F45" # Azul oscuro profundo (fondo principal de la aplicación)

secondaryBackgroundColor = "#32667F" # Azul acero (barra lateral, contenedores y tablas)

textColor = "#F3B940" # Amarillo cálido para el texto principal con buen contraste

accentColor = "#EEA23A" # Tono de acento secundario

font = "sans serif" # Fuente principal de la interfaz

[ui]

hideTopBar = false
